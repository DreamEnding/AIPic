services:
  aipic:
    image: "${AIPIC_IMAGE:-aipic:0.4.11}"
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: runtime
    container_name: aipic
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "${AIPIC_PORT:-8080}:8788"
    environment:
      AIPIC_ACCESS_TOKEN: "${AIPIC_ACCESS_TOKEN:?Set an application access token}"
      AIPIC_PROVIDERS: '${AIPIC_PROVIDERS:-{}}'
      DEFAULT_API_URL: "${DEFAULT_API_URL:-https://www.chream.me}"
      API_PROXY_URL: "${API_PROXY_URL:-https://www.chream.me}"
      ENABLE_API_PROXY: "${ENABLE_API_PROXY:-true}"
      LOCK_API_PROXY: "${LOCK_API_PROXY:-true}"
      FLYREQ_TASK_CONCURRENCY: "${FLYREQ_TASK_CONCURRENCY:-4}"
    volumes:
      - aipic-data:/data
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8788/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  aipic-data:
