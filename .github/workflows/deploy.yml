name: Optional GitHub Pages Deployment
run-name: Deploy GitHub Pages from ${{ github.ref_name }}

# Production is deployed by the existing Cloudflare Pages Git integration.
# GitHub Pages is optional and must be explicitly configured before manual use.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: npm ci

      - name: Build static GitHub Pages site
        env:
          # GitHub Pages serves static files and has no API proxy or task backend.
          VITE_TASK_BACKEND: ''
          VITE_API_PROXY_AVAILABLE: 'false'
          VITE_API_PROXY_LOCKED: 'false'
          VITE_DOCKER_DEPLOYMENT: 'false'
          VITE_DOCKER_LEGACY_API_URL_USED: 'false'
          VITE_DEFAULT_API_URL: ${{ vars.VITE_DEFAULT_API_URL }}
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build -- --base "${PAGES_BASE_PATH}/"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
